[package]
name = "familytree"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "FamilyTree: e-Devlet soy ağacı PDF'lerinden yerel aile ağacı ve akrabalık bulucu"
default-run = "familytree"

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
familytree-core = { path = "../core" }
tauri = { version = "2.12.6", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rusqlite = "0.43.0"
tauri-plugin-dialog = "2.8.4"
dirs = "7.0.0"

[target.'cfg(target_os = "linux")'.dependencies]
# Pencere sınıfı (StartupWMClass) .desktop dosyasıyla eşleşsin diye program adı
gtk = "0.18"
