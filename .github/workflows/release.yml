# Release yayınlanınca Windows kurulumunu (Inno Setup), Ubuntu/Debian paketini (.deb) ve
# macOS paketini (.dmg) derleyip release'e ekler; hepsi bitince SHA256SUMS.txt üretilir.
# C Launcher uyumlu:
#   Windows: FamilyTree-<sürüm>-windows-x64-setup.exe  (inno, AppId sabit)
#   Linux:   familytree_<sürüm>_amd64.deb               (paket adı familytree)
#   macOS:   FamilyTree-<sürüm>-macos-arm64.dmg         (FamilyTree.app)
# Etiket (v<sürüm>) src-tauri/tauri.conf.json'daki sürümle aynı olmalı.
# Elle çalıştırmak için: Actions -> Release -> Run.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release etiketi (ör. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  version-check:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Etiket ve uygulama sürümü aynı mı
        run: |
          v="$(jq -r .version src-tauri/tauri.conf.json)"
          test "v$v" = "$TAG" || { echo "Etiket $TAG, uygulama sürümü $v" >&2; exit 1; }

  windows-setup:
    needs: version-check
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      # Üçüncü taraf eylem yerine runner'daki rustup (yazma yetkili iş akışı)
      - run: rustup toolchain install stable --profile minimal; rustup default stable
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm install
      - name: Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Exe ve kurulum
        run: .\scripts\build-installer.ps1
      - name: Release'e yükle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = $env:TAG.TrimStart('v')
          $exe = "dist\FamilyTree-$ver-windows-x64-setup.exe"
          if (-not (Test-Path $exe)) { throw "Kurulum bulunamadi: $exe" }
          gh release upload $env:TAG $exe --clobber

  linux-deb:
    needs: version-check
    # Paket derlendiği dağıtımın glibc'sini ister: desteklenen en eski Ubuntu'da derle
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: WebKitGTK geliştirme paketleri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm install
      - name: .deb paketi
        run: bash packaging/linux/build-deb.sh
      - name: Release'e yükle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deb="dist/familytree_${TAG#v}_amd64.deb"
          test -f "$deb" || { echo "Paket bulunamadi: $deb" >&2; exit 1; }
          gh release upload "$TAG" "$deb" --clobber

  macos-dmg:
    needs: version-check
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm install
      - name: .app ve .dmg
        timeout-minutes: 30
        run: bash packaging/macos/build-dmg.sh
      - name: Release'e yükle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg="dist/FamilyTree-${TAG#v}-macos-arm64.dmg"
          test -f "$dmg" || { echo "Paket bulunamadi: $dmg" >&2; exit 1; }
          gh release upload "$TAG" "$dmg" --clobber

  checksums:
    needs: [windows-setup, linux-deb, macos-dmg]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir sums
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D sums -p "*.exe" -p "*.deb" -p "*.dmg"
          (cd sums && sha256sum * | sort -k2) > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt -R "$GITHUB_REPOSITORY" --clobber
