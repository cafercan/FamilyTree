# Release yayınlanınca Linux (.deb, .AppImage) ve Windows (NSIS kurulum .exe)
# paketlerini derleyip release'e ekler. Elle çalıştırmak için: Actions -> Release -> Run.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release etiketi (ör. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  linux:
    # Paket derlendiği dağıtımın glibc'sini ister: desteklenen en eski Ubuntu'da derle
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: WebKitGTK geliştirme paketleri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev
      # Üçüncü taraf eylem yerine runner'daki rustup (yazma yetkili iş akışı)
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm install
      - run: npx tauri build --bundles deb,appimage
      - name: Paketi dene
        run: ./target/release/familytree --selftest
      - name: Release'e yükle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage --clobber

  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      # Üçüncü taraf eylem yerine runner'daki rustup (yazma yetkili iş akışı)
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm install
      - run: npx tauri build --bundles nsis
      - name: Paketi dene
        run: .\target\release\familytree.exe --selftest
      - name: Release'e yükle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem target\release\bundle\nsis\*.exe
          if (-not $files) { throw "Kurulum bulunamadi" }
          gh release upload $env:TAG $files.FullName --clobber
